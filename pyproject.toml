[project]
name = "nano-deepspeed"
version = "0.1.0"
description = "Fork of zv1131860787/nano-deepspeed — T2 train line of nano-ai-infra-stack: nano_model integration, engine checkpoint, Megatron-style TP"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5",
    "safetensors>=0.4",
    "numpy",
    # T2 path dependency: the trained subject (T1a deliverable).
    # Local dev resolves ../nano-model inside the stack checkout;
    # Docker builds use the stack root as build context for the same reason.
    "nano-model",
]

[tool.uv.sources]
nano-model = { path = "../nano-model", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nano_deepspeed"]
